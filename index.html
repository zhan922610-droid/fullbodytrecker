<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="Офлайн дневник силовых тренировок Full Body">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Full Body Tracker</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand-button" id="homeBtn" aria-label="На главную"><span class="brand-mark">FB</span><span>FULL BODY</span></button>
      <button class="icon-button" id="settingsBtn" aria-label="Настройки">⚙</button>
    </header>
    <main id="app" aria-live="polite"></main>
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item active" data-view="home"><span>⌂</span>Главная</button>
      <button class="nav-item" data-view="history"><span>◷</span>История</button>
      <button class="nav-item" data-view="progress"><span>↗</span>Прогресс</button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="./app.js"></script>
</body>
</html>
